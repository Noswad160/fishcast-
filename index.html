<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fishcast</title>
<meta name="description" content="Fishing forecast with tips for each spot, species and set of conditions, plus a catch log that learns what works where you fish.">
<meta name="theme-color" content="#0f5c56" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b3b37" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fishcast">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="var(--band-deep)"/><path d="M0 360c60-22 120-22 180 0s120 22 180 0 100-22 152-8v160H0z" fill="var(--band)"/><path d="M256 64v118" stroke="var(--foam)" stroke-width="18" stroke-linecap="round"/><circle cx="256" cy="282" r="110" fill="var(--accent)"/><path d="M146 282a110 110 0 0 0 220 0z" fill="var(--foam)"/></svg>
    <button class="spotbtn" id="spotBtn" data-act="pickSpot" aria-label="Change spot"><span class="label">Fishing at</span><b id="spotName">…</b></button>
    <button class="iconbtn" id="refreshBtn" data-act="refresh" aria-label="Refresh conditions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg></button>
  </div>
</header>

<main class="wrap" id="view"></main>

<button class="fab" id="fab" data-act="logCatch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Catch</button>

<nav class="nav" aria-label="Sections">
  <div class="in">
    <button class="navbtn" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/><circle cx="12" cy="16" r="1.4" fill="currentColor"/></svg>Today</button>
    <button class="navbtn" data-tab="spots"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Spots</button>
    <button class="navbtn" data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12c3-4 7-5 11-3l4-3v12l-4-3c-4 2-8 1-11-3z"/><circle cx="8" cy="11" r=".8" fill="currentColor"/></svg>Catches</button>
  </div>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="scrim" data-act="closeSheet"></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="grab"></div><div id="sheetBody"></div></div>
</div>
<div class="mapview" id="mapView" role="dialog" aria-modal="true" aria-label="Pick a spot on the map" hidden></div>
<div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button id="toastAct" hidden></button></div>

<script src="engine.js"></script>
<script src="map.js"></script>
<script src="app.js"></script>
</body>
</html>
